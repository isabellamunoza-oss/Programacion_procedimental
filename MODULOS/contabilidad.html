<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
   <link rel="stylesheet" href="../CSS/contabilidad.css">
   <link rel="stylesheet" href="../JS/CONTABILIDAD.js">
  <title>Contabilidad</title>
</head>

<body>

  <section class="section">
    <div class="container">

      <h1 class="title">Contabilidad</h1>


      <div class="field">
        <label class="label">Ventas</label>
        <div class="control">
          <input class="input" type="text" placeholder="Ingrese las ventas" id="Ventas">
        </div>
      </div>

      
      <div class="field">
        <label class="label">Fecha</label>
        <div class="control">
          <input class="input" type="date" id="Fecha">
        </div>
      </div>

      
      <div class="field">
        <label class="label">Ingresos</label>
        <div class="control">
          <input class="input" type="number" placeholder="Ingrese los ingresos" id="Ingresos">
        </div>
      </div>

     
      <div class="field">
        <label class="label">Egresos</label>
        <div class="control">
          <input class="input" type="number" placeholder="Ingrese los egresos" id="Egresos">
        </div>
      </div>

     
      <div class="field">
        <label class="label">Concepto</label>
        <div class="control">
          <input class="input" type="text" placeholder="Ingrese el concepto" id="Concepto">
        </div>
      </div>

      
      <div class="field">
        <label class="label">Valor</label>
        <div class="control">
          <input class="input" type="number" placeholder="Ingrese el valor" id="valor">
        </div>
      </div>

      
      <div class="field is-grouped">
        <div class="control">
          <button class="button is-link">Guardar</button>
        </div>

        <div class="control">
           <a class="button is-link is-light" type="button" href="../INDEX.HTML"> HOME</a>
        </div>
      </div>

    </div>
  </section>

</body>

</html>
